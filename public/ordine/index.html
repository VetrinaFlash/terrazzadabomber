<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b130a"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">

<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/ordine/ordine.css"><script src="/ordine/ordine.js" defer></script></head>
<body class="track-page">
<header class="site-header"><div class="header-inner"><a class="brand" href="/"><img class="brand-logo" src="/assets/img/tipiko-logo.png" data-fallback="https://uploads3.fw360.it/uploads/env/4/16712/img/logos/tipikolog.png" alt="Tipiko Ristorante Pizzeria"></a><a class="btn btn-outline" href="/#menu">Menu</a></div></header>
<main class="track">
