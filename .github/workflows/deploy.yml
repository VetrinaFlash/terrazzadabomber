name: Deploy Terrazza da Bomber (Workers + D1)
on:
  # Backup manuale: il deploy automatico è gestito da Cloudflare Workers Builds
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terrazzadabomber-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Best-effort download of original photographs
        run: npm run photos
      - name: Verify deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          test -n "$CF_TOKEN" || { echo 'Missing GitHub secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Missing GitHub secret CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test ${#ADMIN_PASS} -ge 14 || { echo 'GitHub secret ADMIN_PASSWORD must contain at least 14 characters'; exit 1; }
      - name: Create or connect D1, apply migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run prepare:cloudflare
          npm run migrate:remote
          npm run deploy
      - name: Configure admin authentication and stable Web Push keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/set-secrets.mjs
